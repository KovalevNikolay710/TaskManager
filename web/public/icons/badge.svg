    <rect x="44" y="24" width="42" height="11" rx="5.5"/>
    <circle cx="23" cy="51" r="6.5"/>
    <rect x="44" y="45.5" width="30" height="11" rx="5.5"/>
    <circle cx="23" cy="72" r="6.5"/>
    <rect x="44" y="66.5" width="18" height="11" rx="5.5"/>
  </g>
</svg>
