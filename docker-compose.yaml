services:
  db:
    image: postgres:13-alpine
    container_name: manager_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=task_manager_db
      - TZ=Europe/Moscow
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: always
    networks:
      - manager_network
    command: ["postgres", "-c", "timezone=Europe/Moscow"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: task_manager_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=12345678
      - DB_NAME=task_manager_db
      - DB_PORT=5432
      - TZ=Europe/Moscow
    restart: always
    networks:
      - manager_network
    ports:
      - "8080:8080"

networks:
  manager_network:

volumes:
  db_data:
